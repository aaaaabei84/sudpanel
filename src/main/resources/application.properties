# Local workstation application; bind to loopback by default.
server.address=127.0.0.1
server.port=${SUDPANEL_PORT:18890}
sudpanel.name=SudPanel
sudpanel.version=@project.version@
server.error.include-message=always

# No automatic Android SDK discovery. Set an explicit path to enable device access.
sudpanel.adb-path=${SUDPANEL_ADB_PATH:disabled}
sudpanel.wait-ms=2000
# Use a separate data directory from any existing internal installation.
sudpanel.db-path=${SUDPANEL_DATA_DIR:${user.home}/.sudpanel-open}/data/sudpanel.db
sudpanel.resource-id-file=${SUDPANEL_DATA_DIR:${user.home}/.sudpanel-open}/config/resource-ids.properties

sudpanel.perf-tap-settle-ms=400
sudpanel.perf-playing-wait-ms=2500
# Empty means direct connection. Configure explicitly if a local proxy is needed.
sudpanel.api.proxy=
sudpanel.logcat-tail-lines=2000
